<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column of instrument modules. The pad is a star chart:
   sequenced steps are stars joined in playing order, and modulators are
   moons orbiting the steps they move. Night is a ship's console; day is a
   printed star atlas. Keys sit on a hard shadow and sink when pressed.
   Colour has jobs:
     yellow   on / selected / highlighted         (--hold)
     cyan     playing now (the playhead)          (--now)
     red      recording                           (--rec)
   Star colours follow stellar classes (red = low, blue-white = high) and
   stay clear of those three. Module accents (--m-*) colour knob arcs. */
:root {
  --bg: #E6EAF0; --panel: #F4F6F9; --well: #DCE1E9;
  --ink: #101521; --muted: #556076; --edge: #A9B3C3; --shadow: #A9B1C0;
  --cap-hi: #FFFFFF; --cap-lo: #E3E7EE; --track: rgba(16,21,33,.12);
  --now: #0092B8; --hold: #F2C200; --on-ink: #15120A; --rec: #E0263F;
  --sky: #F2F4F8; --sky-line: rgba(16,21,33,.30); --sky-star: rgba(16,21,33,.45);
  --m-body: #D9466F; --m-noise: #6F7A92; --m-metal: #4F6FE0; --m-res: #D7861A;
  --m-filter: #7C5CE6; --m-out: #E0582E; --m-kit: #101521;
  --font-head: 'Oxanium', 'Eurostile', system-ui, sans-serif;
  --font-ui: 'Chakra Petch', 'Eurostile', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05070C; --panel: #0C111B; --well: #0E1320;
    --ink: #E4E9F3; --muted: #8590A8; --edge: #2B3650; --shadow: #000;
    --cap-hi: #1E2638; --cap-lo: #141B29; --track: rgba(255,255,255,.08);
    --now: #3BE0FF; --hold: #FFD21F; --rec: #FF3B5C;
    --sky: #03050A; --sky-line: rgba(200,212,255,.22); --sky-star: rgba(220,228,255,.6);
    --m-body: #FF6B91; --m-noise: #A9B2C8; --m-metal: #7F9BFF; --m-res: #FFAA3D;
    --m-filter: #A98BFF; --m-out: #FF7D52; --m-kit: #E4E9F3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05070C; --panel: #0C111B; --well: #0E1320;
  --ink: #E4E9F3; --muted: #8590A8; --edge: #2B3650; --shadow: #000;
  --cap-hi: #1E2638; --cap-lo: #141B29; --track: rgba(255,255,255,.08);
  --now: #3BE0FF; --hold: #FFD21F; --rec: #FF3B5C;
  --sky: #03050A; --sky-line: rgba(200,212,255,.22); --sky-star: rgba(220,228,255,.6);
  --m-body: #FF6B91; --m-noise: #A9B2C8; --m-metal: #7F9BFF; --m-res: #FFAA3D;
  --m-filter: #A98BFF; --m-out: #FF7D52; --m-kit: #E4E9F3;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; color: var(--ink); background: var(--bg);
  font: 500 15px/1.45 var(--font-ui);
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 760px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- key: the shared 3D button body ---------- */
.cap {
  position: relative; border: 1.5px solid var(--edge); border-radius: 10px;
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
  color: var(--ink); cursor: pointer; font-family: var(--font-ui);
  box-shadow: 0 4px 0 var(--shadow);
  transition: transform .07s, box-shadow .07s, background-color .12s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.cap:active, .cap.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.cap:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }
/* switched on: sunk, and lit in the indicator yellow */
.cap.lit, .cap[aria-pressed="true"], .cap[aria-selected="true"] {
  background: var(--hold); color: var(--on-ink); border-color: transparent;
  transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--hold);
}

header.top { display: grid; gap: 8px; margin-bottom: 14px; }
.toprow { display: flex; align-items: center; gap: 8px; }
h1 { font: 700 clamp(20px, 5vw, 30px)/1 var(--font-head); letter-spacing: .18em; margin: 0 auto 0 0; }
h2 { font: 600 14px/1.2 var(--font-head); margin: 0; letter-spacing: .16em; text-transform: uppercase; text-wrap: balance; }
h3 { font: 600 11.5px/1 var(--font-head); margin: 0; letter-spacing: .18em; text-transform: uppercase; }

.pagenav { display: flex; gap: 6px; flex: none; }
.navbtn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; }
.subrow { display: flex; align-items: center; gap: 8px; }
.subrow .dicecap { margin-left: auto; font: 600 10.5px/1.2 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; }
#helpBtn { width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }

/* pages slide sideways as a strip (Web Animations in ui.js) */
.pages { position: relative; overflow: hidden; touch-action: pan-y; padding: 0 6px 8px; margin: 0 -6px; }
.page { display: none; }
.page.active { display: block; }
.page.leaving { position: absolute; top: 0; left: 6px; right: 6px; pointer-events: none; }

/* ---------- pad, with the ratchet bar on its right ---------- */
.padrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; max-width: 768px; margin: 0 auto; }
.padwrap {
  position: relative; max-width: 100%; aspect-ratio: 1 / 1;
  border: 1.5px solid var(--edge); border-radius: 16px; overflow: hidden; background: var(--sky);
  box-shadow: 0 5px 0 var(--shadow);
}
.padwrap canvas {
  display: block; width: 100%; height: 100%;
  touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.padwrap canvas:focus-visible { outline: 2px solid var(--hold); outline-offset: -5px; }
.ratchet {
  position: relative; border-radius: 12px; background: var(--well); border: 1.5px solid var(--edge);
  box-shadow: inset 0 2px 0 rgba(0,0,0,.12); touch-action: none; cursor: ns-resize; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.ratchet .rstop { position: absolute; left: 0; right: 0; display: grid; justify-items: center; gap: 3px; transform: translateY(50%); pointer-events: none; }
.ratchet .rstop span { font: 500 9px/1 var(--font-mono); color: var(--muted); }
.ratchet .rstop i { width: 10px; height: 1.5px; border-radius: 1px; background: var(--edge); }
.rthumb {
  position: absolute; left: 3px; right: 3px; height: 34px; border-radius: 9px; z-index: 1; transform: translateY(50%);
  display: grid; place-items: center; font: 700 11px/1 var(--font-mono); color: var(--ink);
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo)); border: 1.5px solid var(--edge); box-shadow: 0 3px 0 var(--shadow);
  transition: bottom .16s cubic-bezier(.3, 1.7, .5, 1);
}
.ratchet.held .rthumb { transition: none; background: var(--hold); color: var(--on-ink); border-color: transparent; box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--hold); }
.ratchet:focus-visible .rthumb { outline: 2px solid var(--hold); outline-offset: 2px; }

/* ---------- knob: the arc ring and the cap's shadow stay put; only the
   pointer turns ---------- */
.knobgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px 4px; margin-top: 12px; }
.knob {
  --rot: 0deg; display: grid; justify-items: center; align-content: start; gap: 3px; min-width: 0;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize;
  -webkit-tap-highlight-color: transparent; outline: none;
}
.knob-dial { position: relative; width: var(--kd, 52px); height: var(--kd, 52px); }
.knob-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.knob-dial .trk { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.knob-dial .val { fill: none; stroke: var(--accent, var(--ink)); stroke-width: 4; stroke-linecap: round; }
.knob-cap {
  position: absolute; inset: 18%; border-radius: 50%; border: 1.5px solid var(--edge);
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
  box-shadow: 0 3px 0 var(--shadow);
}
.knob-ptr { position: absolute; inset: 0; transform: rotate(var(--rot)); }
.knob-ptr::after {
  content: ''; position: absolute; top: 10%; left: 50%; width: 2.5px; height: 30%;
  background: var(--ink); border-radius: 2px; transform: translateX(-50%);
}
.knob-value { font: 500 11px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
.knob-label { font: 600 10px/1.15 var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; text-align: center; max-width: 100%; }
.knob.active .knob-cap, .knob:focus-visible .knob-cap { box-shadow: 0 0 0 2px var(--hold), 0 3px 0 var(--shadow); }
.knob.active .knob-value, .knob:focus-visible .knob-value { background: var(--hold); color: var(--on-ink); }
/* a knob's modulation source: a tiny picker under its label, in the
   modulator's own colour once set; the ring round the dial is its depth */
.modsel {
  border: 1px solid var(--edge); border-radius: 5px; background: var(--well); min-width: 30px; height: 18px; padding: 0 5px;
  font: 600 9px/1 var(--font-mono); color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.modsel.set { color: #0E1320; border-color: transparent; }
.modsel .dot { display: none; }
.knob-dial .mring { fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: .95; }

/* ---------- dice: a track with the die as a key-sized face; drag right
   for a stronger roll of whichever page is showing ---------- */
.dicefield { flex: none; }
.dicetrack {
  --dh: 34px; position: relative; width: 96px; height: var(--dh); border-radius: 9px; overflow: hidden; cursor: pointer;
  background: var(--well); border: 1.5px solid var(--edge); box-shadow: inset 0 2px 0 rgba(0,0,0,.12);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.dicetrack[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.dicetrack .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--hold); opacity: .85; }
.die {
  position: absolute; top: 0; left: 0; width: calc(var(--dh) - 3px); height: calc(var(--dh) - 3px); border-radius: 7.5px; z-index: 2;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--dh) * .2); background: #F7F9FC;
  transition: left .5s cubic-bezier(.3,.9,.3,1.1), transform .5s cubic-bezier(.3,.9,.3,1.1);
}
.die i { width: 4.5px; height: 4.5px; border-radius: 50%; background: #0E1320; place-self: center; }
.die i:nth-child(1) { grid-area: 1 / 1; } .die i:nth-child(2) { grid-area: 1 / 3; } .die i:nth-child(3) { grid-area: 2 / 2; }
.die i:nth-child(4) { grid-area: 3 / 1; } .die i:nth-child(5) { grid-area: 3 / 3; }
.dicetrack.dragging .die { transition: none; }
.dicetrack:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }

/* ---------- transport row + steps ---------- */
.seq { margin-top: 20px; }
.transport { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.transport .knobslot { flex: 1 1 0; min-width: 0; }
.transport .knob { --kd: 48px; }
.btn { font: 700 12px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; padding: 0 14px; min-height: 42px; }
.btn.icon { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 0 10px; }
#play, #record, #smooth { width: 54px; height: 54px; border-radius: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
#record { color: var(--rec); }
/* record keeps its own red when armed rather than the indicator yellow */
#record[aria-pressed="true"] { background: var(--rec); color: #fff; box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--rec); }
#record[aria-pressed="true"] svg { animation: recBlink 1s step-start infinite; }
@keyframes recBlink { 50% { opacity: .25; } }
#play .ic-stop { display: none; }
#play[aria-pressed="true"] .ic-play { display: none; }
#play[aria-pressed="true"] .ic-stop { display: inline-block; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { display: grid; gap: 6px; }
.led { display: block; height: 4px; border-radius: 2px; background: var(--track); }
.cell.now .led { background: var(--now); box-shadow: 0 0 10px var(--now); }
.step {
  position: relative; width: 100%; aspect-ratio: 5 / 6; padding: 0; border-radius: 10px; overflow: hidden;
  border: 1.5px solid var(--edge); background: var(--well); color: var(--ink); cursor: pointer;
  box-shadow: 0 4px 0 var(--shadow);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; transition: transform .07s, box-shadow .07s;
}
.step .n { position: absolute; top: 6px; left: 8px; font: 600 12px/1 var(--font-head); letter-spacing: .04em; opacity: .5; }
.step .dot {
  display: none; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(5,7,12,.55);
  left: calc(14% + var(--dx, .5) * 72%); bottom: calc(12% + var(--dy, .5) * 56%); transform: translate(-50%, 50%);
}
.step.on { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%), var(--c, #555); color: var(--tc, #fff); border-color: rgba(0,0,0,.35); }
.step.on .n { opacity: .9; }
.step.on .dot { display: block; }
.step .hits { position: absolute; top: 4px; right: 6px; font: 700 10px/1 var(--font-mono); letter-spacing: -1px; opacity: .85; }
.cell.now .step { transform: translateY(-2px); box-shadow: 0 6px 0 var(--shadow), 0 0 0 2px var(--now); }
.step.held { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow), 0 0 0 3px var(--hold); }
.step:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.tools .gap { flex: 1 1 8px; }

/* ---------- dropdowns: an app key that opens a list (ui.js createMenu) ---------- */
.dd {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 34px; padding: 0 22px 0 8px; border-radius: 9px;
  font: 600 11px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; text-align: left; white-space: nowrap;
}
.dd > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dd::after { content: ''; position: absolute; right: 8px; top: 50%; width: 5px; height: 5px; margin-top: -4px; border: solid currentColor; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); opacity: .7; }
.dd svg { flex: none; }
.dd[aria-expanded="true"] { border-color: var(--hold); }
.menu {
  position: fixed; z-index: 60; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 2px; padding: 6px;
  background: var(--panel); border: 1.5px solid var(--edge); border-radius: 12px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.55);
}
.menu[hidden] { display: none; }
.menu.two { grid-template-columns: 1fr 1fr; }
.menu button {
  display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: var(--ink);
  font: 600 11.5px/1.15 var(--font-ui); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .menu button:hover { background: var(--well); } }
.menu button:focus-visible { background: var(--well); outline: none; }
.menu button[aria-selected="true"] { background: var(--hold); color: var(--on-ink); }
.menu .grouplabel { grid-column: 1 / -1; font: 600 9.5px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 3px; }
.menu.tiny button { min-height: 32px; font-size: 11px; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
/* rolled by holding the die and tapping */
@keyframes rolled { 0% { transform: rotate(0); } 30% { transform: rotate(-8deg) scale(1.06); } 60% { transform: rotate(6deg); } 100% { transform: none; } }
.rolled { animation: rolled .35s ease-out; }

/* ---------- modulation page ---------- */
.modsky { aspect-ratio: 16 / 11; }
.mods { display: grid; gap: 6px; margin-top: 12px; }
.modhead, .mod { display: grid; grid-template-columns: 40px minmax(0, 1fr) 46px 46px; gap: 6px; align-items: center; }
.modhead { padding: 0 7px 0 6px; margin-bottom: -2px; }
.modhead span:last-child { grid-column: 3 / 5; text-align: center; font: 600 9.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.mod { padding: 5px 6px 5px 5px; border-radius: 11px; border: 1.5px solid var(--edge); background: var(--well); cursor: pointer; }
.mod.sel { border-color: var(--hold); box-shadow: 0 0 0 1px var(--hold); }
.mod canvas { width: 40px; height: 40px; display: block; border-radius: 8px; background: var(--sky); }
.mod .mid { display: grid; gap: 4px; min-width: 0; }
.mod .nm { justify-self: start; display: flex; align-items: center; gap: 6px; padding: 1px 4px 1px 0; border: 0; background: none; color: var(--ink); cursor: pointer; font: 600 11px/1.1 var(--font-head); letter-spacing: .16em; -webkit-tap-highlight-color: transparent; }
.mod .nm i { width: 8px; height: 8px; border-radius: 50%; background: var(--mc); }
.mod .dds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 5px; }
.mod .dd { height: 28px; font-size: 10px; padding: 0 18px 0 6px; gap: 4px; border-radius: 8px; box-shadow: 0 3px 0 var(--shadow); }
.mod .dd::after { right: 7px; }
.assign { font: 700 10px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; width: 46px; height: 40px; padding: 0 2px; border-radius: 9px; touch-action: none; }
.assign:disabled { opacity: .3; cursor: default; }
.modedit { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 2px 4px; margin-top: 2px; border-top: 1px solid var(--edge); cursor: default; }
.modkeys { display: grid; gap: 8px; }
.mini { font: 700 10px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; min-width: 52px; height: 30px; padding: 0 6px; border-radius: 8px; }
.mini b { font: 700 13px/1 var(--font-mono); }
.mini[hidden] { display: none; }
.modedit .knobgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 2px; margin-top: 0; --accent: var(--mc); }
.modedit .knob { --kd: 44px; }

/* ---------- lanes ---------- */
.lanehead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 12px; }
.lanehead h2 { margin-right: auto; }
.lanetabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 700 11.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; padding: 0 12px; min-height: 36px; border-radius: 9px; }
.btn.small { min-height: 36px; font-size: 11.5px; border-radius: 9px; }
#laneCanvas {
  display: block; width: 100%; height: min(58vh, 460px); margin-top: 14px; border-radius: 10px;
  touch-action: none; cursor: crosshair; background: var(--sky); border: 1.5px solid var(--edge);
}
.lanereadout { margin: 8px 0 0; min-height: 1.3em; font: 500 12px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- engine ---------- */
.enginepick { display: flex; gap: 8px; margin: 10px 0 2px; align-items: center; }
.dd.drum { width: auto; min-width: 150px; max-width: 60%; height: 36px; font: 600 12.5px/1 var(--font-head); letter-spacing: .12em; }
.modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 14px; margin-top: 14px; }
.module[data-mod="body"], .module[data-mod="res"] { grid-column: 1 / -1; }
.module { padding-top: 10px; border-top: 1px solid var(--edge); }
.module h3 { display: flex; align-items: center; gap: 8px; }
.module h3::before { content: ''; width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.module .knobgrid { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px 0; margin-top: 8px; }
.module h3 { cursor: default; }
.module .knob { --kd: 42px; }
.module .knob-label { font-size: 9px; }
.module .knob-value { font-size: 10px; }

.clipcard { display: grid; gap: 6px; padding: 5px; border-radius: 12px; border: 1.5px solid var(--edge); background: var(--well); cursor: pointer; text-align: left; color: var(--ink); font: inherit; -webkit-tap-highlight-color: transparent; }
.clipcard img { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background: var(--sky); }

.clipcard[aria-selected="true"] { border-color: var(--hold); box-shadow: 0 0 0 2px var(--hold); }
.clipcard.playing span { color: var(--now); }
.clipnote { margin: 14px 0 0; color: var(--muted); font-size: 13px; min-height: 1.3em; }

/* ---------- preferences ---------- */

.prefrow > span { display: grid; gap: 2px; font-weight: 600; }
.prefrow small { font-size: 12px; color: var(--muted); font-weight: 500; }
.seg { display: flex; gap: 6px; }
#prefAssign { min-width: 58px; }

/* ---------- help sheet: what's on the page you're looking at ---------- */
.help {
  position: fixed; z-index: 50; inset: auto 0 0 0; max-height: 72vh; overflow-y: auto;
  background: var(--panel); border-top: 1.5px solid var(--edge); border-radius: 18px 18px 0 0; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.5);

}
.help .inner { max-width: 720px; margin: 0 auto; display: grid; gap: 10px; }
.help .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.how b { color: var(--ink); font-weight: 700; }
kbd { font: 500 12px var(--font-mono); padding: 1px 5px; border: 1.5px solid var(--edge); border-radius: 5px; background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--shadow); }

/* ==========================================================================
   Kit map: every point on the XY pad is a full set of drum-voice parameters.
   Anchors (named drums) sit at fixed positions; the parameters at any point
   are a soft blend of nearby anchors, so dragging morphs kick -> tom -> snare
   -> clap -> hats and so on.
   x: tonal (left) -> noisy and metallic (right)     y: low (bottom) -> high (top)
   ========================================================================== */

const N_STEPS = 16;
const SIGMA = 0.09;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hsl2rgb(h, s, l) {
  h /= 360;
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    return (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255;
  };
  return [f(0), f(8), f(4)];
}

/* Voice parameters

   drive   saturation (0-1)   fold  wavefolder (0-1)   atk  attack (s)   lvl  output trim */

};

const ANCHORS = ANCHOR_DEFS.map((d) => ({
  name: d.name, x: d.x, y: d.y,
  rgb: hsl2rgb(d.hue, 0.72, 0.58),
  p: Object.assign({}, BASE, d.p),
}));

function weightsAt(x, y) {
  let m = Infinity;
  const d2 = ANCHORS.map((a) => {
    const d = (a.x - x) * (a.x - x) + (a.y - y) * (a.y - y);
    if (d < m) m = d;
    return d;
  });
  let s = 0;
  const w = d2.map((d) => { const v = Math.exp(-(d - m) / (2 * SIGMA * SIGMA)); s += v; return v; });
  return w.map((v) => v / s);
}

const LOG_KEYS = new Set(['f', 'pDec', 'tDec', 'nDec', 'mDec', 'mPitch', 'hp', 'lp', 'atk', 'fmRatio', 'resF', 'resDec']);
const GROUPS = [
  [['f', 'pEnv', 'pDec', 'tDec', 'fm', 'fmRatio'], (p) => p.tone + 0.03],
  [['resF', 'resDec', 'resShape'], (p) => p.res + 0.03],
  [['nDec', 'burst'], (p) => p.noise + 0.03],
  [['mDec', 'mPitch'], (p) => p.metal + 0.03],
  [['hp', 'lp', 'q'], (p) => p.noise + p.metal + 0.03],
  [['tone', 'noise', 'metal', 'res', 'drive', 'fold', 'atk', 'lvl'], () => 1],
];

function paramsAt(x, y, w) {
  w = w || weightsAt(x, y);
  const out = {};
  for (const [keys, gate] of GROUPS) {
    for (const key of keys) {
      const lg = LOG_KEYS.has(key);
      let sw = 0, acc = 0;
      for (let i = 0; i < ANCHORS.length; i++) {
        const g = w[i] * gate(ANCHORS[i].p);
        const v = ANCHORS[i].p[key];
        acc += g * (lg ? Math.log(v) : v);
        sw += g;
      }
      const r = acc / sw;
      out[key] = lg ? Math.exp(r) : r;
    }
  }
  return out;
}

function colorAt(x, y, w) {
  w = w || weightsAt(x, y);
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < ANCHORS.length; i++) {
    r += w[i] * ANCHORS[i].rgb[0]; g += w[i] * ANCHORS[i].rgb[1]; b += w[i] * ANCHORS[i].rgb[2];
  }
  return [r, g, b];
}

/* maps a 0..1 slider value to a decay-length multiplier: 0.25x .. 4x,
   with 0.5 landing exactly on 1x (no change) */
function decayMultiplier(v) { return Math.pow(4, 2 * clamp(v, 0, 1) - 1); }

function nearest(w, n) {
  return w.map((v, i) => ({ name: ANCHORS[i].name, w: v })).sort((a, b) => b.w - a.w).slice(0, n);
}

/* voiceSignature: maps a voice's own parameters to a visual identity, so a
   point's look always follows its sound rather than a label.
   t      0 (low/tonal) .. 1 (high/noisy) on a log-frequency scale
   hue    30 (orange, low) .. 335 (pink) .. 280 (violet, high); kept clear of
          the UI's indicator yellow and playhead cyan
   tW/nW/mW  body / noise / metal share of the sound (sums to 1), used to mix
             liquid / smoke / spark behaviour
   level  rough loudness, drives particle count and size
   dec    a single representative decay time (s), drives particle lifetime */
function voiceSignature(P) {
  const body = clamp(P.tone, 0, 1), res = clamp(P.res || 0, 0, 1);
  const tone = clamp(body + res, 0, 1), noise = clamp(P.noise, 0, 1), metal = clamp(P.metal, 0, 1);
  const total = tone + noise + metal;
  const norm = total > 0.001 ? total : 1;
  const tW = tone / norm, nW = noise / norm, mW = metal / norm;
  const bodyN = body + res > 0.001 ? body + res : 1;
  const toneF = (body * P.f + res * (P.resF || P.f)) / bodyN;
  const toneDec = (body * P.tDec + res * (P.resDec || P.tDec)) / bodyN;
  const dec = (tone * toneDec + noise * P.nDec + metal * P.mDec) / norm;
  const noiseF = Math.sqrt(Math.max(P.hp, 20) * Math.min(Math.max(P.lp, P.hp * 1.2), 18000));
  const freq = clamp((tone * toneF + (noise + metal) * noiseF) / norm, 25, 18000);
  const t = clamp((Math.log(freq) - Math.log(28)) / (Math.log(15000) - Math.log(28)), 0, 1);
  const hue = (30 - 110 * t + 360) % 360;
  const level = clamp(total * 0.65 + P.drive * 0.35, 0.08, 1.4);
  const sat = clamp(0.55 + nW * 0.15 + tW * 0.12, 0, 0.92);
  const light = clamp(0.4 + mW * 0.22 + level * 0.08, 0, 0.8);
  return { t, hue, tW, nW, mW, freq, level, dec, drive: clamp(P.drive + (P.fold || 0), 0, 1), rgb: hsl2rgb(hue, sat, light) };
}

/* ==========================================================================
   Drum voice (Web Audio). One call = one hit.
   body: sine + pitch envelope (+ FM, any ratio)  noise: white noise, optional clap bursts
   metal: six detuned squares (808 hat ratios)   noise+metal -> high-pass -> low-pass
   resonator: a mallet click into five tuned band-passes (modal synthesis)
   all layers -> wavefolder (sine) -> drive (tanh) -> output. Short exponential amp envelopes.
   ========================================================================== */

const METAL_RATIOS = [205.3, 304.4, 369.6, 522.7, 540, 800];
const BURST_GAP = 0.0105;
const SHAPER_CURVE = (() => {
  const n = 2048, c = new Float32Array(n), k = 1.5, d = Math.tanh(k);
  for (let i = 0; i < n; i++) c[i] = Math.tanh((i / (n - 1) * 2 - 1) * k) / d;
  return c;
})();

/* wavefolder: a sine fold, crossfaded in from dry so small amounts are
   gentle. Curves are cached per 1/50th of the fold amount. */
const FOLD_CURVES = new Map();
function foldCurve(amount) {
  const key = Math.round(clamp(amount, 0, 1) * 50);
  let c = FOLD_CURVES.get(key);
  if (!c) {
    const a = key / 50, n = 2048, k = 1 + 7 * a, m = Math.min(1, a * 4);
    c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1) * 2 - 1;
      c[i] = (1 - m) * x + m * Math.sin(x * k * Math.PI / 2);
    }
    FOLD_CURVES.set(key, c);
  }
  return c;
}

/* the glide voice's folder: one fixed sine fold, k = 8, with the amount
   set by how hard it's driven and how much of it is mixed in. Close to
   foldCurve(amount) behind its input gain, and it can move mid-note. */
const GLIDE_FOLD = (() => {
  const n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++) c[i] = Math.sin((i / (n - 1) * 2 - 1) * 4 * Math.PI);
  return c;
})();
function foldMix(amount) {
  const a = clamp(amount, 0, 1), g = 1 + 2.2 * a, m = Math.min(1, a * 4);
  return { dry: (1 - m) * g, drive: g * (1 + 7 * a) / 8, wet: m };
}

/* resonator mode ratios. resShape morphs (log domain) between three
   idealized bodies: a string/tube (harmonic), a circular membrane, and a
   free bar (marimba, bell-ish). */
const MODE_SETS = [
  [1, 2, 3, 4, 5],
  [1, 1.594, 2.136, 2.296, 2.653],
  [1, 2.756, 5.404, 8.933, 13.344],
];
const MODE_AMPS = [1, 0.62, 0.46, 0.36, 0.28];
function modeRatios(shape) {
  const s = clamp(shape, 0, 1) * 2;
  const i = Math.min(1, Math.floor(s)), f = s - i;
  return MODE_SETS[0].map((_, k) => Math.exp(Math.log(MODE_SETS[i][k]) * (1 - f) + Math.log(MODE_SETS[i + 1][k]) * f));
}
/* Q that makes a band-pass ring for `t60` seconds at `freq`: a two-pole
   resonator's envelope falls as exp(-pi f t / Q), and -60 dB is ln(1000). */
function modeQ(freq, t60) { return clamp(Math.PI * freq * t60 / Math.log(1000), 0.5, 4000); }

/* a short half-sine "mallet" pulse; its area is what the resonator gain
   compensation divides by. One buffer per context. The buffer runs on in
   silence for 4 s: Chromium stops processing a biquad ~0.28 s after its
   source ends (tail-time cap), so the source has to outlive the ring. */
const CLICK_BUFS = new WeakMap();
const CLICK_LEN = 12;
const CLICK_AREA = (() => { let s = 0; for (let i = 0; i < CLICK_LEN; i++) s += Math.sin(Math.PI * (i + 0.5) / CLICK_LEN); return s; })();
function clickBuf(ctx) {
  let b = CLICK_BUFS.get(ctx);
  if (!b) {
    b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 4.05), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < CLICK_LEN; i++) d[i] = Math.sin(Math.PI * (i + 0.5) / CLICK_LEN);
    CLICK_BUFS.set(ctx, b);
  }
  return b;
}

function ampEnv(param, t, atk, level, dec) {
  param.setValueAtTime(0, t);
  param.linearRampToValueAtTime(level, t + atk);
  param.exponentialRampToValueAtTime(0.0008, t + atk + dec);
}

/* noise envelope; returns the lead time taken by pre-bursts */
function noiseEnv(param, t, atk, level, dec, burst) {
  param.setValueAtTime(0, t);
  let tt = t;
  if (burst > 0.03) {
    for (let i = 0; i < 3; i++) {
      param.linearRampToValueAtTime(level * burst, tt + 0.0008);
      param.exponentialRampToValueAtTime(level * burst * 0.08 + 0.0005, tt + BURST_GAP * 0.9);
      tt += BURST_GAP;
    }
  }
  param.linearRampToValueAtTime(level, tt + atk);
  param.exponentialRampToValueAtTime(0.0008, tt + atk + dec);
  return tt - t;
}

function makeNoise(ctx) {
  const len = Math.floor(ctx.sampleRate * 2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

/* the kit-wide macro mixes applied to one voice's parameters; 1 = unchanged */
function mixedParams(P, trims) {
  const m = (k) => (trims[k] == null ? 1 : trims[k]);
  return Object.assign({}, BASE, P, {
    tone: clamp(P.tone * m('toneMix'), 0, 2),
    noise: clamp(P.noise * m('noiseMix'), 0, 2),
    metal: clamp(P.metal * m('metalMix'), 0, 2),
    res: clamp((P.res || 0) * m('resMix'), 0, 2),
    atk: Math.max(0.0002, P.atk * m('punch')),
  });
}

/* playVoice: one hit. Returns {end, srcs} or, with opts.glide, a handle whose
   glide(P2, at) steers the still-ringing voice toward another point on the
   map: pitch, filters, the balance of its layers and its level move; its
   envelopes and decays stay as they were struck. A glide voice builds every
   layer (silent ones at zero) so a layer can fade in mid-note, which costs
   more nodes, so only smooth-mode hits ask for it. */
const GLIDE_TAU = 0.012;
function playVoice(ctx, out, noiseBuf, P, trims, t, extraDecay, opts) {
  const glide = !!(opts && opts.glide);
  const tune = Math.pow(2, trims.tune / 12);
  const dm = trims.decay * (extraDecay == null ? 1 : extraDecay);
  const drive = clamp(P.drive + trims.drive, 0, 1);
  const fold = clamp((P.fold || 0) + (trims.fold || 0), 0, 1);
  P = mixedParams(P, trims);

  const pre = ctx.createGain(); pre.gain.value = 1 + drive * 5;
  const shp = ctx.createWaveShaper(); shp.curve = SHAPER_CURVE;
  const post = ctx.createGain(); post.gain.value = P.lvl * 0.9 / (1 + drive * 0.8);
  pre.connect(shp); shp.connect(post); post.connect(out);
  // every layer feeds `bus`: straight into the drive stage, or through the
  // wavefolder first when there's any fold
  let bus = pre, foldNodes = null;
  if (glide) {
    // glide voices always carry a folder so a glide can fade fold in: a
    // dry path and a sine fold path, crossfaded (see foldMix)
    bus = ctx.createGain();
    const dry = ctx.createGain(), fin = ctx.createGain(), wet = ctx.createGain();
    const fs = ctx.createWaveShaper(); fs.curve = GLIDE_FOLD; fs.oversample = '2x';
    bus.connect(dry); dry.connect(pre); bus.connect(fin); fin.connect(fs); fs.connect(wet); wet.connect(pre);
    const fm = foldMix(fold);
    dry.gain.value = fm.dry; fin.gain.value = fm.drive; wet.gain.value = fm.wet;
    foldNodes = { dry, fin, wet };
  } else if (fold > 0.01) {
    // more fold also drives the folder harder, so it keeps biting into the tail
    bus = ctx.createGain(); bus.gain.value = 0.8 + fold * 2.4;
    const fs = ctx.createWaveShaper(); fs.curve = foldCurve(fold); fs.oversample = '2x';
    bus.connect(fs); fs.connect(pre);
  }

  let end = t;
  const srcs = []; // every source, so a stolen voice can be stopped outright
  const stopAt = (node, time) => { node.stop(time); srcs.push(node); if (time > end) end = time; };
  // glide voices: each layer's envelope runs at full scale into a mix gain
  // that carries the layer's level, so the level can move later
  const G = {};
  const mixInto = (level, dest) => { const m = ctx.createGain(); m.gain.value = level; m.connect(dest); return m; };
  // a layer that's silent when struck rings as long as the voice's longest
  // layer, so a later glide can still fade it in
  const on = (lvl) => lvl > 0.02;
  const longest = Math.max(on(P.tone) ? P.tDec : 0, on(P.noise) ? P.nDec : 0, on(P.metal) ? P.mDec : 0, on(P.res) ? P.resDec : 0, 0.05);
  const decOf = (lvl, d) => (glide && !on(lvl) ? longest : d);

  if (P.tone > 0.02 || glide) {
    const f = P.f * tune, fs = f * Math.pow(2, P.pEnv), tau = Math.max(0.003, P.pDec / 3);
    const dur = decOf(P.tone, P.tDec) * dm;
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(fs, t);
    osc.frequency.setTargetAtTime(f, t, tau);
    const g = ctx.createGain();
    ampEnv(g.gain, t, P.atk, glide ? 1 : P.tone, dur);
    if (P.fm > 0.02 || glide) {
      const mod = ctx.createOscillator(); mod.type = 'sine';
      mod.frequency.setValueAtTime(fs * P.fmRatio, t);
      mod.frequency.setTargetAtTime(f * P.fmRatio, t, tau);
      const mg = ctx.createGain();
      // glide voices: the envelope runs at unit depth into a gain that
      // carries the FM amount, so the amount can move later
      mg.gain.setValueAtTime((glide ? 1 : P.fm) * f * 4, t);
      mg.gain.setTargetAtTime(0, t, Math.max(0.008, dur * 0.25));
      mod.connect(mg);
      if (glide) { G.fmAmt = ctx.createGain(); G.fmAmt.gain.value = P.fm; mg.connect(G.fmAmt); G.fmAmt.connect(osc.frequency); }
      else mg.connect(osc.frequency);
      mod.start(t); stopAt(mod, t + P.atk + dur + 0.05);
      G.mod = mod;
    }
    osc.connect(g);
    if (glide) { G.tone = mixInto(P.tone, bus); g.connect(G.tone); G.osc = osc; G.sweepEnd = t + P.pDec; }
    else g.connect(bus);
    osc.start(t); stopAt(osc, t + P.atk + dur + 0.05);
  }

  const wantN = P.noise > 0.02 || glide, wantM = P.metal > 0.02 || glide;
  if (wantN || wantM) {
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass';
    hp.frequency.value = P.hp; hp.Q.value = -3;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = Math.min(Math.max(P.lp, P.hp * 1.2), ctx.sampleRate * 0.45);
    lp.Q.value = P.q;
    hp.connect(lp); lp.connect(bus);
    if (glide) { G.hp = hp; G.lp = lp; }

    if (wantN) {
      const dur = decOf(P.noise, P.nDec) * dm;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const ng = ctx.createGain();
      const lead = noiseEnv(ng.gain, t, P.atk, glide ? 1 : P.noise, dur, P.burst);
      src.connect(ng);
      if (glide) { G.noise = mixInto(P.noise, hp); ng.connect(G.noise); } else ng.connect(hp);
      src.start(t, Math.random() * (noiseBuf.duration - 0.2));
      stopAt(src, t + lead + P.atk + dur + 0.05);
    }
    if (wantM) {
      const dur = decOf(P.metal, P.mDec) * dm;
      const mg = ctx.createGain();
      ampEnv(mg.gain, t, P.atk, (glide ? 1 : P.metal) * 0.35, dur);
      if (glide) G.metalOsc = [];
      for (const r of METAL_RATIOS) {
        const o = ctx.createOscillator(); o.type = 'square';
        o.frequency.value = r * P.mPitch * tune;
        o.connect(mg);
        o.start(t); stopAt(o, t + P.atk + dur + 0.05);
        if (glide) G.metalOsc.push([o, r]);
      }
      if (glide) { G.metal = mixInto(P.metal, hp); mg.connect(G.metal); } else mg.connect(hp);
    }
  }

  if (P.res > 0.02 || glide) {
    const sr = ctx.sampleRate, t60 = Math.min(4, decOf(P.res, P.resDec) * dm);
    const src = ctx.createBufferSource(); src.buffer = clickBuf(ctx);
    const rg = ctx.createGain(); rg.gain.value = P.res * 0.45;
    rg.connect(bus);
    if (glide) { G.res = rg; G.modes = []; }
    modeRatios(P.resShape).forEach((r, k) => {
      const fr = P.resF * tune * r;
      if (fr > sr * 0.45) return;
      const Q = modeQ(fr, t60), w0 = 2 * Math.PI * fr / sr;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = fr; bp.Q.value = Q;
      // a band-pass hit by a unit impulse rings at ~sin(w0)/Q; undo that
      // so every mode starts at MODE_AMPS[k] whatever its pitch and ring
      const g = ctx.createGain(); g.gain.value = MODE_AMPS[k] * Q / (Math.sin(w0) * CLICK_AREA);
      src.connect(bp); bp.connect(g); g.connect(rg);
      if (glide) G.modes.push([bp, k]);
    });
    src.start(t + P.atk);
    stopAt(src, t + P.atk + t60 + 0.02);
  }
  if (!glide) return { end, srcs };

  return {
    end, srcs,
    glide(P2, at) {
      at = Math.max(at, t);
      const Q = mixedParams(P2, trims), to = (param, v) => param.setTargetAtTime(v, at, GLIDE_TAU);
      // the body's pitch sweep keeps running; a glide during it retargets
      // where the sweep lands
      const f = Q.f * tune, when = Math.max(at, G.sweepEnd || at);
      if (G.osc) G.osc.frequency.setTargetAtTime(f, when, GLIDE_TAU);
      if (G.mod) G.mod.frequency.setTargetAtTime(f * Q.fmRatio, when, GLIDE_TAU);
      if (G.fmAmt) to(G.fmAmt.gain, Q.fm);
      if (G.tone) to(G.tone.gain, Q.tone);
      if (G.noise) to(G.noise.gain, Q.noise);
      if (G.metal) to(G.metal.gain, Q.metal);
      if (G.metalOsc) for (const [o, r] of G.metalOsc) to(o.frequency, r * Q.mPitch * tune);
      if (G.hp) { to(G.hp.frequency, Q.hp); to(G.lp.frequency, Math.min(Math.max(Q.lp, Q.hp * 1.2), ctx.sampleRate * 0.45)); to(G.lp.Q, Q.q); }
      if (G.res) {
        to(G.res.gain, Q.res * 0.45);
        const rr = modeRatios(Q.resShape);
        for (const [bp, k] of G.modes) to(bp.frequency, Math.min(Q.resF * tune * rr[k], ctx.sampleRate * 0.45));
      }
      const d2 = clamp(P2.drive + trims.drive, 0, 1), fm2 = foldMix(clamp((P2.fold || 0) + (trims.fold || 0), 0, 1));
      to(pre.gain, 1 + d2 * 5);
      to(post.gain, Q.lvl * 0.9 / (1 + d2 * 0.8));
      to(foldNodes.dry.gain, fm2.dry); to(foldNodes.fin.gain, fm2.drive); to(foldNodes.wet.gain, fm2.wet);
    },
  };
}

/* autoAt: a smooth-recorded step's position at offset o (0..1 through the

function autoAt(auto, o) {
  const p = clamp(o, 0, 1) * (auto.length - 1), i = Math.min(auto.length - 2, Math.floor(p)), f = p - i;

  }

  function drawPad(now) {
    const W = pad.width, H = pad.height, u = dpr;
    const px = (x) => x * W, py = (y) => (1 - y) * H;
    pg.clearRect(0, 0, W, H);
    pg.drawImage(field, 0, 0, W, H);
    drawStarChart(pg, W, H, u, now, { playhead: true });
    // cursor: a plain dot, deliberately unthemed so it always reads as
    // "you". Touching grows it and adds a thin ring.
    const c = seq.cursor, cx = px(c.x), cy = py(c.y);
    const held = seq.padHeld();
    if (held) {
      pg.strokeStyle = rgbs(theme.glint, 0.55); pg.lineWidth = 1.5 * u;
      pg.beginPath(); pg.arc(cx, cy, 15 * u, 0, 6.283); pg.stroke();
    }
    pg.fillStyle = 'rgba(5,7,12,.85)';
    pg.beginPath(); pg.arc(cx, cy, (held ? 8.5 : 6.5) * u, 0, 6.283); pg.fill();
    pg.fillStyle = '#fff';
    pg.beginPath(); pg.arc(cx, cy, (held ? 6 : 4.5) * u, 0, 6.283); pg.fill();
  }

  /* ---------- pad input ---------- */
  function toXY(e) {
    const r = pad.getBoundingClientRect();
    return {
      x: clamp((e.clientX - r.left) / r.width, 0, 1),
      y: clamp(1 - (e.clientY - r.top) / r.height, 0, 1),
    };
  }
  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault(); ensureAudio();
    try { pad.setPointerCapture(e.pointerId); } catch (_) {}
    pad.focus({ preventScroll: true });
    const p = toXY(e);
    lastAud = { t: 0, x: p.x, y: p.y };
    seq.padPress(e.pointerId, p.x, p.y);
  });
  pad.addEventListener('pointermove', (e) => {
    if (!seq.padDown.has(e.pointerId)) return;
    const p = toXY(e);
    seq.padMove(p.x, p.y);
  });
  const padUp = (e) => { seq.padRelease(e.pointerId); if (!seq.padHeld()) { stopPadHold(); liveNext = 0; } history.commit(); };
  pad.addEventListener('pointerup', padUp);
  pad.addEventListener('pointercancel', padUp);
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
  pad.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 0.1 : 0.02;
    const c = seq.cursor;
    let nx = c.x, ny = c.y;
    if (e.key === 'ArrowLeft') nx -= step;
    else if (e.key === 'ArrowRight') nx += step;
    else if (e.key === 'ArrowUp') ny += step;
    else if (e.key === 'ArrowDown') ny -= step;
    else if (e.key === 'Enter') { e.preventDefault(); lastAud.t = 0; seq.padPress('kb', c.x, c.y); seq.padRelease('kb'); return; }
    else return;
    e.preventDefault();
    seq.padMove(clamp(nx, 0, 1), clamp(ny, 0, 1));
  });

  /* ---------- step tiles ---------- */
  const stepsEl = $('#steps');
  const cells = [], tiles = [];
  for (let g = 0; g < 4; g++) {
    const grp = document.createElement('div');
    grp.className = 'grp';
    for (let k = 0; k < 4; k++) {
      const i = g * 4 + k;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<i class="led" aria-hidden="true"></i><button type="button" class="step"><span class="n"></span><span class="dot"></span><span class="hits" aria-hidden="true"></span></button>';
      const btn = cell.querySelector('button');
      btn.querySelector('.n').textContent = String(i + 1);
      // A click that follows a pointer gesture was already handled by pointerdown/up;
      // only clicks with no preceding pointer gesture come from the keyboard.
      let viaPointer = false, clearTimer = null;
      const endPointer = () => { clearTimeout(clearTimer); clearTimer = setTimeout(() => { viaPointer = false; }, 600); };
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); ensureAudio();
        viaPointer = true; clearTimeout(clearTimer);
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        // trash held: this step is deleted when it's let go
        if (trash) { trash.used = true; trash.steps.add(i); btn.classList.add('doomed'); return; }
        seq.stepDown(i);
      });
      btn.addEventListener('pointerup', () => {
        btn.classList.remove('doomed');
        if (trash && trash.steps.has(i)) { trash.steps.delete(i); seq.erase(i); }
        else seq.stepUp(i);
        endPointer(); history.commit();
      });
      btn.addEventListener('pointercancel', () => { seq.stepCancel(i); endPointer(); });
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        if (viaPointer) { viaPointer = false; return; }
        ensureAudio(); seq.stepDown(i); seq.stepUp(i); // keyboard activation (Enter / Space)
      });
      grp.appendChild(cell);
      cells.push(cell); tiles.push(btn);
    }
    stepsEl.appendChild(grp);
  }

  function renderSteps() {
    tiles.forEach((el, i) => {
      const s = seq.steps[i];
      const held = seq.held.has(i) || seq.latched.has(i);
      el.classList.toggle('on', s.on);
      el.classList.toggle('held', held);
      el.setAttribute('aria-pressed', s.on ? 'true' : 'false');
      if (s.on) {
        const w = weightsAt(s.x, s.y);
        const c = TILE(voiceSignature(paramsAt(s.x, s.y, w)).t);
        el.style.setProperty('--c', `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`);
        el.style.setProperty('--tc', lum(c) > 0.5 ? '#11132a' : '#ffffff');
        el.style.setProperty('--dx', s.x.toFixed(3));
        el.style.setProperty('--dy', s.y.toFixed(3));
        const hits = 1 + (Array.isArray(s.ratchets) ? s.ratchets.length : 0);
        el.querySelector('.hits').textContent = hits > 1 ? '\u2022'.repeat(hits) : '';
        el.setAttribute('aria-label', `Step ${i + 1}, on, ${nearest(w, 1)[0].name}${s.auto ? ', smooth' : ''}${hits > 1 ? `, ${hits} hits` : ''}, ${Math.round(s.prob * 100)} percent chance`);
      } else {
        el.querySelector('.hits').textContent = '';
        el.setAttribute('aria-label', `Step ${i + 1}, off`);
      }
    });
    updateHead();
  }
  function updateHead() { cells.forEach((c, i) => c.classList.toggle('now', i === cur)); }

  /* ---------- formatting helpers (still used by the drum engine editor) ---------- */
  const fmtHz = (v) => (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + ' kHz' : Math.round(v) + ' Hz');
  const fmtT = (s) => (s >= 1 ? s.toFixed(2) + ' s' : s < 0.01 ? (s * 1000).toFixed(1) + ' ms' : Math.round(s * 1000) + ' ms');

  /* ==========================================================================
     Drum engine editor: every named drum is a control point the rest of the
     map blends toward (see core.js), so editing one here reshapes that part
     of the map, not just a single fixed sound. Edits apply immediately and
     last for the session; Reset this drum restores its shipped tuning.
     ========================================================================== */
  function fmtParam(unit, v) {
    if (unit === 'hz') return fmtHz(v);
    if (unit === 's') return fmtT(v);
    if (unit === 'oct') return v.toFixed(2) + ' oct';
    if (unit === 'x') return '\u00d7' + v.toFixed(2);
    if (unit === 'q') return v.toFixed(1);
    if (unit === 'shape') return v < 0.2 ? 'string' : v < 0.4 ? 'tube' : v < 0.6 ? 'skin' : v < 0.8 ? 'plate' : 'bar';
    return Math.round(v * 100) + '%';
  }

  const ORIGINAL_PARAMS = ANCHORS.map((a) => Object.assign({}, a.p));
  const engineParams = $('#engineParams');
  let engineIdx = 0; // the drum being edited
  const engineMenu = createMenu($('#engineSelect'), {
    label: 'Drum to edit', cls: 'two', minWidth: 260,
    items: () => ANCHORS.map((a, i) => ({ value: i, label: a.name, icon: `<i class="dot" style="background:${rgbs(starRGB(voiceSignature(a.p).t), 1)}"></i>` })),
    value: () => engineIdx,
    onPick: (i) => { engineIdx = i; loadAnchorIntoEditor(); },
  });
  let fieldRefreshTimer = null, engineAuditionTimer = null;
  function scheduleFieldRefresh() {
    clearTimeout(fieldRefreshTimer);
    fieldRefreshTimer = setTimeout(() => { field = buildSky(pad.width, pad.height); modField = null; dirty = true; }, 90);
  }
  function auditionAnchorSoon(a) {
    clearTimeout(engineAuditionTimer);
    engineAuditionTimer = setTimeout(() => {
      ensureAudio();
      const P = playAt(a.x, a.y);
    }, 60);
  }
  /* while a slider is being dragged and the sequence isn't playing,
     retrigger the drum at the quantize-slider's rate as a live preview of
     the sound change. */
  let sliderPreviewTimer = null;
  function startSliderPreview(a) {
    stopSliderPreview();
    ensureAudio();
    const fire = () => playAt(a.x, a.y);
    fire();
    sliderPreviewTimer = setInterval(fire, slotDuration(tempo, 16) * 1000);
  }
  function stopSliderPreview() {
    if (sliderPreviewTimer) { clearInterval(sliderPreviewTimer); sliderPreviewTimer = null; }
  }
  const moduleGrids = {};
  for (const m of MODULES) {
    const el = document.createElement('div');
    el.className = 'module'; el.style.setProperty('--accent', `var(${m.accent})`);
    el.innerHTML = '<h3></h3><div class="knobgrid"></div>';
    el.dataset.mod = m.id;
    el.style.setProperty('--n', PARAM_SPECS.filter((p) => p.mod === m.id).length);
    el.querySelector('h3').textContent = m.label;
    engineParams.appendChild(el);
    moduleGrids[m.id] = el.querySelector('.knobgrid');
    // hold the die and tap a section's name: roll just that section
    randTargets.set(el.querySelector('h3'), (st) => {
      const a = ANCHORS[engineIdx], q = jitterParams(Object.assign({}, a.p), st);
      for (const p of PARAM_SPECS) if (p.mod === m.id) a.p[p.key] = q[p.key];
      loadAnchorIntoEditor(); scheduleFieldRefresh();
    });
  }
  const paramRows = PARAM_SPECS.map((spec) => {
    const container = document.createElement('div');
    moduleGrids[spec.mod].appendChild(container);
    const slider = createKnob(container, {
      min: spec.min, max: spec.max, step: spec.step, value: BASE[spec.key], log: spec.log,
      def: () => ORIGINAL_PARAMS[engineIdx][spec.key],
      label: spec.label, fmt: (v) => fmtParam(spec.unit, v),
      onInput: (v) => {
        const a = ANCHORS[engineIdx];
        a.p[spec.key] = v;
        scheduleFieldRefresh();
        stepsDirty = readoutDirty = laneDirty = true;
        if (playing) auditionAnchorSoon(a);
      },
      onPointerDown: () => { if (!playing) startSliderPreview(ANCHORS[engineIdx]); },
      onPointerUp: stopSliderPreview,
      onChange: () => history.commit(),
      mod: knobMod(spec.key, () => ({ kind: 'drum', a: engineIdx })),
    });
    return { spec, slider };
  });
  function loadAnchorIntoEditor() {
    const a = ANCHORS[engineIdx];
    engineMenu.paint();
    paramRows.forEach(({ spec, slider }) => { slider.set(a.p[spec.key]); slider.refreshMod(); });
  }
  $('#engineReset').addEventListener('click', () => {
    const idx = engineIdx;
    ANCHORS[idx].p = Object.assign({}, ORIGINAL_PARAMS[idx]);
    loadAnchorIntoEditor();
    scheduleFieldRefresh();
    stepsDirty = readoutDirty = laneDirty = true;
    history.commit();
  });
  loadAnchorIntoEditor();

  /* ==========================================================================
     Step lanes: probability, and X/Y deviation (chance + amount), one row
     of 16 mini-bars per lane. Drag up and down within a step's column to
     set a value; drag sideways to paint several steps in one sweep.
     ========================================================================== */
  const LANES = {
    prob: { rows: [{ key: 'prob', label: 'chance it plays' }] },
    devx: { rows: [{ key: 'devXChance', label: 'chance of an X jump' }, { key: 'devXAmount', label: 'how far it can jump' }] },
    devy: { rows: [{ key: 'devYChance', label: 'chance of a Y jump' }, { key: 'devYAmount', label: 'how far it can jump' }] },
    decay: { rows: [{ key: 'decay', label: 'base decay' }, { key: 'decDevChance', label: 'chance of a decay jump' }, { key: 'decDevAmount', label: 'how far it can jump' }] },
  };
  let laneMode = 'prob';

  function resizeLaneCanvas() {
    const r = laneCanvas.getBoundingClientRect();
    const d = Math.min(2.5, window.devicePixelRatio || 1);
    laneCanvas.width = Math.max(2, Math.round(r.width * d));
    laneCanvas.height = Math.max(2, Math.round(r.height * d));
    laneDirty = true;
  }

  function drawLanes() {
    const W = laneCanvas.width, H = laneCanvas.height, u = laneCanvas.width / laneCanvas.getBoundingClientRect().width || 1;
    lg.clearRect(0, 0, W, H);
    const rows = LANES[laneMode].rows;
    const colW = W / N_STEPS;
    const rowH = H / rows.length;
    const gap = Math.max(2, colW * 0.14);

    for (let i = 0; i < N_STEPS; i++) {
      const s = seq.steps[i];
      const on = s.on;
      const tc = TILE(voiceSignature(paramsAt(s.x, s.y)).t);
      const base = px2(i, colW);
      if (i === cur) {
        lg.fillStyle = theme.now; lg.globalAlpha = 0.16;
        lg.fillRect(base, 0, colW, H); lg.globalAlpha = 1;
      }
      rows.forEach((row, ri) => {
        const top = ri * rowH, h = rowH - gap;
        const v = clamp(s[row.key], 0, 1);
        lg.fillStyle = rgbs(theme.glint, on ? 0.08 : 0.04);
        lg.fillRect(base + gap / 2, top + gap / 2, colW - gap, h - gap / 2);
        const barH = Math.max(2 * u, v * (h - gap / 2));
        const rgb = on ? tc : [120, 126, 144];
        const barTop = top + (h - gap / 2) - barH + gap / 2;
        lg.fillStyle = rgbs(rgb, on ? 0.95 : 0.45);
        lg.fillRect(base + gap / 2, barTop, colW - gap, barH);
        lg.fillStyle = rgbs(theme.glint, on ? 0.6 : 0.2);
        lg.fillRect(base + gap / 2, barTop, colW - gap, Math.min(barH, 3 * u));
        // a neutral mark at the middle of the decay row shows "no change"
        if (row.key === 'decay') {
          lg.fillStyle = rgbs(theme.glint, 0.4);
          lg.fillRect(base + gap / 2, top + (h - gap / 2) * 0.5, colW - gap, Math.max(1, u));
        }
      });
    }
    // a divider between stacked bands, so the eye (and the thumb) can tell
    // them apart before a drag ever starts
    if (rows.length > 1) {
      lg.strokeStyle = rgbs(theme.glint, 0.14); lg.lineWidth = Math.max(1, u);
      lg.beginPath();
      for (let ri = 1; ri < rows.length; ri++) { lg.moveTo(0, ri * rowH); lg.lineTo(W, ri * rowH); }
      lg.stroke();
    }
  }
  function px2(i, colW) { return i * colW; }

  // A drag locks onto the row (band) it started in, at pointerdown, and
  // keeps editing that same row even if the finger drifts into another
  // band's area — only sideways movement (which column) still tracks live.
  function laneColAndY(e) {
    const r = laneCanvas.getBoundingClientRect();
    return {
      relX: clamp((e.clientX - r.left) / r.width, 0, 0.999999),
      relY: clamp((e.clientY - r.top) / r.height, 0, 0.999999),
    };
  }
  function rowValue(relY, rowIndex, rowCount) {
    const top = rowIndex / rowCount, h = 1 / rowCount;
    return clamp(1 - (relY - top) / h, 0, 1);
  }
  let laneDrag = null;
  function showLaneReadout(col, label, value) {
    const el = $('#laneReadout');
    if (!el) return;
    el.textContent = `Step ${col + 1}, ${label}: ${formatLaneValue(laneDrag ? LANES[laneMode].rows[laneDrag.rowIndex].key : '', value)}`;
  }
  function formatLaneValue(key, value) {
    if (key === 'decay') return '\u00d7' + decayMultiplier(value).toFixed(2);
    return Math.round(value * 100) + '%';
  }
  laneCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { laneCanvas.setPointerCapture(e.pointerId); } catch (_) {}
    const { relX, relY } = laneColAndY(e);
    const rows = LANES[laneMode].rows;
    const rowIndex = Math.min(rows.length - 1, Math.floor(relY * rows.length));
    const col = Math.min(N_STEPS - 1, Math.floor(relX * N_STEPS));
    laneDrag = { pointerId: e.pointerId, rowIndex };
    const value = rowValue(relY, rowIndex, rows.length);
    seq.setLane(col, rows[rowIndex].key, value);
    showLaneReadout(col, rows[rowIndex].label, value);
  });
  laneCanvas.addEventListener('pointermove', (e) => {
    if (!laneDrag || laneDrag.pointerId !== e.pointerId) return;
    const { relX, relY } = laneColAndY(e);
    const rows = LANES[laneMode].rows;
    const col = Math.min(N_STEPS - 1, Math.floor(relX * N_STEPS));
    const value = rowValue(relY, laneDrag.rowIndex, rows.length);
    seq.setLane(col, rows[laneDrag.rowIndex].key, value);
    showLaneReadout(col, rows[laneDrag.rowIndex].label, value);
  });
  const laneUp = (e) => { if (laneDrag && laneDrag.pointerId === e.pointerId) { laneDrag = null; history.commit(); } };
  laneCanvas.addEventListener('pointerup', laneUp);
  laneCanvas.addEventListener('pointercancel', laneUp);
  laneCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.querySelectorAll('.lanetabs .tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lanetabs .tab').forEach((b) => b.setAttribute('aria-selected', 'false'));
      btn.setAttribute('aria-selected', 'true');
      laneMode = btn.dataset.lane;
      $('#laneReadout').textContent = '\u00a0';
      laneDirty = true;
    });
  });
  $('#laneReset').addEventListener('click', () => {
    const map = {
      prob: ['prob'], devx: ['devXChance', 'devXAmount'], devy: ['devYChance', 'devYAmount'],
      decay: ['decay', 'decDevChance', 'decDevAmount'],
    };
    seq.resetLane(map[laneMode]);
  });

  /* ---------- knob: drag up/right to turn up, down/left to turn down
     (Shift for fine), double-tap to reset, arrow keys to nudge. A 270
     degree arc shows the value; bipolar knobs fill from 12 o'clock. log
     knobs move evenly in ratio (pitches, times), not in Hz or seconds.
     Same API the old hslider had: { value, set(v) }. ---------- */
  function createKnob(container, opts) {
    container.style.display = 'grid'; container.style.justifyItems = 'center'; container.style.gap = '4px';
    container.innerHTML = '<div class="knob" tabindex="0" role="slider"><div class="knob-dial">' +
      '<svg viewBox="0 0 52 52" aria-hidden="true"><path class="trk"/><path class="val"/><path class="mring"/></svg>' +
      '<div class="knob-cap"><i class="knob-ptr"></i></div></div><span class="knob-value"></span><span class="knob-label"></span></div>';
    const el = container.querySelector('.knob');
    const valPath = el.querySelector('.val'), valueEl = el.querySelector('.knob-value'), ringPath = el.querySelector('.mring');
    el.querySelector('.trk').setAttribute('d', arcPath(-KNOB_SWEEP / 2, KNOB_SWEEP / 2));
    el.querySelector('.knob-label').textContent = opts.label;
    el.setAttribute('aria-label', opts.ariaLabel || opts.label);
    el.setAttribute('aria-valuemin', opts.min);
    el.setAttribute('aria-valuemax', opts.max);
    const step = opts.step || 1;
    const initial = opts.value;
    let value = opts.value;
    const useLog = !!opts.log && opts.min > 0;
    const toPos = (v) => useLog ? Math.log(v / opts.min) / Math.log(opts.max / opts.min) : (v - opts.min) / (opts.max - opts.min);
    const fromPos = (p) => useLog ? opts.min * Math.pow(opts.max / opts.min, p) : opts.min + p * (opts.max - opts.min);
    const snap = (v) => {
      const q = Math.round((v - opts.min) / step) * step + opts.min;
      return Math.min(opts.max, Math.max(opts.min, +q.toFixed(6)));
    };
    function render() {
      const pos = clamp(toPos(value), 0, 1);
      const ang = -KNOB_SWEEP / 2 + pos * KNOB_SWEEP;
      const from = opts.bipolar ? 0 : -KNOB_SWEEP / 2;
      valPath.setAttribute('d', arcPath(from, ang));
      valPath.style.opacity = !opts.bipolar && pos < 0.004 ? 0 : 1;
      el.style.setProperty('--rot', ang + 'deg');
      valueEl.textContent = opts.fmt ? opts.fmt(value) : String(value);
      el.setAttribute('aria-valuenow', value);
      el.setAttribute('aria-valuetext', valueEl.textContent);
      drawRing(ang);
    }
    /* a modulated knob gets a ring in its modulator's colour: how far the
       modulation reaches either side of the value (one side if unipolar or
       an envelope). Drag the ring to set the depth. */
    const srcK = () => (opts.mod ? opts.mod.current() : -1);
    function drawRing(ang) {
      const k = srcK();
      if (k < 0) { ringPath.style.display = 'none'; return; }
      const m = mods[k], span = Math.abs(m.depth) * 0.5 * KNOB_SWEEP, lim = KNOB_SWEEP / 2;
      const one = m.uni || isEnv(m), sgn = m.depth < 0 ? -1 : 1;
      const a0 = clamp(one ? ang : ang - span, -lim, lim), a1 = clamp(one ? ang + sgn * span : ang + span, -lim, lim);
      ringPath.setAttribute('d', arcPath(Math.min(a0, a1), Math.max(a0, a1), KNOB_R + 5.5));
      ringPath.style.display = ''; ringPath.style.stroke = modCol(k);
    }
    const emit = () => { if (opts.onInput) opts.onInput(value); };
    let drag = null, lastTap = 0;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.focus({ preventScroll: true });
      const t = performance.now();
      if (t - lastTap < 320) {
        // double-tap: back to the default (for drums, their shipped tuning)
        lastTap = 0;
        value = snap(typeof opts.def === 'function' ? opts.def() : (opts.def != null ? opts.def : initial));
        render(); emit();
        if (opts.onChange) opts.onChange(value);
        return;
      }
      lastTap = t;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, pos: clamp(toPos(value), 0, 1) };
      // on the ring (outside the cap) of a modulated knob: set the depth
      const dial = el.querySelector('.knob-dial').getBoundingClientRect(), k = srcK();
      if (k >= 0 && Math.hypot(e.clientX - (dial.left + dial.width / 2), e.clientY - (dial.top + dial.height / 2)) > dial.width * 0.34) {
        drag.depth = { k, d0: mods[k].depth };
        lastTap = 0;
        valueEl.textContent = `M${k + 1} ${Math.round(mods[k].depth * 100)}%`;
      }
      el.classList.add('active');
      if (opts.onPointerDown) opts.onPointerDown(value);
    });
    el.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      if (drag.depth) {
        const m = mods[drag.depth.k];
        m.depth = Math.round(clamp(drag.depth.d0 + ((e.clientX - drag.x) - (e.clientY - drag.y)) / 160, -1, 1) * 100) / 100;
        drawRing(-KNOB_SWEEP / 2 + clamp(toPos(value), 0, 1) * KNOB_SWEEP);
        valueEl.textContent = `M${drag.depth.k + 1} ${m.depth > 0 ? '+' : ''}${Math.round(m.depth * 100)}%`;
        return;
      }
      const travel = e.shiftKey ? 800 : 200;
      const p = clamp(drag.pos + ((e.clientX - drag.x) - (e.clientY - drag.y)) / travel, 0, 1);
      const v = snap(fromPos(p));
      if (v !== value) { value = v; render(); emit(); }
    });
    const end = (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      if (drag.depth) { drag = null; el.classList.remove('active'); render(); refreshKnobMods(); renderMods(); history.commit(); return; }
      drag = null; el.classList.remove('active');

        items: () => [{ value: -1, label: 'None', short: '\u00b7' }, ...mods.map((m, k) => ({
          value: k, short: `M${k + 1}`, icon: `<i class="dot" style="background:${modCol(k)}"></i>`,
          label: `M${k + 1} ${SHAPE_BY_ID[m.shape].name}` + (m.dest === opts.mod.dest ? '' : ` \u00b7 now ${MOD_DESTS.find((d) => d.id === m.dest)?.name || m.dest}`),
        }))],

    return { get value() { return value; }, set(v) { value = snap(v); render(); }, refreshMod };
  }

  /* ---------- dice slider: a die at the left of a track; drag it right (or
     tap anywhere on the track) to choose a randomization strength 0..1 --
     releasing fires onRoll(strength) once, then the die eases back to the
     left on its own. ---------- */
  function createDiceSlider(container, label, onRoll) {
    container.innerHTML = '<div class="dicetrack" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div><div class="die" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>';

    const die = el.querySelector('.die');
    const dieW = () => die.offsetWidth || 36;
    function place(strength) {
      const r = el.getBoundingClientRect();
      const travel = Math.max(0, el.clientWidth - dieW());
      die.style.left = (strength * travel) + 'px';
      die.style.transform = `rotate(${strength * 450}deg)`;
      fill.style.width = (strength > 0 ? strength * travel + dieW() / 2 : 0) + 'px';
    }
    place(0);
    let dragging = false;
    function fromClientX(clientX) {
      const r = el.getBoundingClientRect();
      const travel = Math.max(1, el.clientWidth - dieW());

      try { el.setPointerCapture(e.pointerId); } catch (_) {}

      updateDice(dieHold.strength);

    el.addEventListener('pointermove', (e) => { if (dragging) { dieHold.strength = fromClientX(e.clientX); updateDice(dieHold.strength); } });
    const end = (e) => {

      const strength = fromClientX(e.clientX), used = dieHold && dieHold.used;

    el.addEventListener('pointercancel', end);

    });
    return el;
  }

  /* ---------- ratchet bar widget: drag up for more hits per step; it
     springs back to 1/16 the moment it's let go. Arrow up/down move it
     while the key is held. ---------- */
  function createRatchetBar(el) {
    const thumb = el.querySelector('.rthumb');
    const PAD = 24, last = RATCHET_VALUES.length - 1;
    const yFor = (i) => { const h = el.clientHeight; return PAD + (h - PAD * 2) * (i / last); };
    function layout() {
      el.querySelectorAll('.rstop').forEach((t) => t.remove());
      RATCHET_VALUES.forEach((v, i) => {
        const t = document.createElement('div'); t.className = 'rstop'; t.style.bottom = yFor(i) + 'px';
        t.innerHTML = `<span>${v}</span><i></i>`; el.appendChild(t);
      });
      show(RATCHET_VALUES.indexOf(ratchetN));
    }
    function show(i) {
      thumb.style.bottom = yFor(i) + 'px';
      thumb.textContent = RATCHET_VALUES[i];
      el.setAttribute('aria-valuenow', RATCHET_VALUES[i]);
      el.setAttribute('aria-valuetext', '1/' + RATCHET_VALUES[i]);

      el.classList.toggle('held', held);
      if (RATCHET_VALUES[i] !== ratchetN || held !== ratchetHeld) setRatchet(RATCHET_VALUES[i], held);

      if (held && pendingBar) pendingBar.n = Math.max(pendingBar.n, RATCHET_VALUES[i]);

    const end = (e) => { if (drag !== e.pointerId) return; drag = null; set(0, false); history.commit(); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      if (!ratchetHeld) pendingBar = { n: 16 };
      set(RATCHET_VALUES.indexOf(ratchetN) + (e.key === 'ArrowUp' ? 1 : -1), true);
    });
    el.addEventListener('keyup', (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { set(0, false); history.commit(); } });
    el.addEventListener('blur', () => { if (ratchetHeld && drag === null) set(0, false); });
    new ResizeObserver(layout).observe(el);
    layout();
  }

  /* kit-wide Decay trim: deliberately a multiplier, not a plain percentage

     matter the drum's native decay), so a percent-of-one-fixed-range
     slider would bunch all its useful motion into a tiny arc. Floor is
     pulled well down (0.05x) so a kit roll that lands on long decays can

  function kitDecaySliderFromValue(m) {
    return Math.round(m >= 1 ? 100 * Math.log(m) / Math.log(KIT_DECAY_CEIL) : -100 * Math.log(m) / Math.log(KIT_DECAY_FLOOR));
  }

    smooth: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15C4.5 15 4.5 9 7 9S9.5 12 12 12S13.5 5 18 5"/></svg>',

  const clearBtn = $('#clear');
  clearBtn.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    e.preventDefault();

  clearBtn.addEventListener('pointercancel', trashUp);

  /* ---------- dropdown: a key showing the current choice; pressing it

  const menuEl = document.createElement('div');

  function createMenu(btn, o) {

  }, true);
  window.addEventListener('resize', closeMenu);

  /* ---------- hold the die and tap something: that one thing is rolled
     (a knob, a dropdown, a modulator's name, a step, an engine section).
     randTargets maps an element to its roll(strength). ---------- */
  let dieHold = null; // {strength, used} while the top-bar die is held
  function rollTarget(e) {
    if (!dieHold || e.target.closest('.dicetrack')) return false;

  /* ==========================================================================
     Modulation page. Six modulators, each a row: a live thumbnail, its

  const modSky = $('#modSky'), msg = modSky.getContext('2d');
