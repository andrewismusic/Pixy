<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column of instrument modules. The pad is a star chart:
   sequenced steps are stars joined in playing order, and modulators are
   moons orbiting the steps they move. Night is a ship's console; day is a
   printed star atlas. Keys sit on a hard shadow and sink when pressed.
   Colour has jobs:
     yellow   on / selected / highlighted         (--hold)
     cyan     playing now (the playhead)          (--now)
     red      recording                           (--rec)
   Star colours follow stellar classes (red = low, blue-white = high) and
   stay clear of those three. Module accents (--m-*) colour knob arcs. */
:root {
  --bg: #E6EAF0; --panel: #F4F6F9; --well: #DCE1E9;
  --ink: #101521; --muted: #556076; --edge: #A9B3C3; --shadow: #A9B1C0;
  --cap-hi: #FFFFFF; --cap-lo: #E3E7EE; --track: rgba(16,21,33,.12);
  --now: #0092B8; --hold: #F2C200; --on-ink: #15120A; --rec: #E0263F;
  --sky: #F2F4F8; --sky-line: rgba(16,21,33,.30); --sky-star: rgba(16,21,33,.45);
  --m-body: #D9466F; --m-noise: #6F7A92; --m-metal: #4F6FE0; --m-res: #D7861A;
  --m-filter: #7C5CE6; --m-out: #E0582E; --m-kit: #101521;
  --font-head: 'Oxanium', 'Eurostile', system-ui, sans-serif;
  --font-ui: 'Chakra Petch', 'Eurostile', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05070C; --panel: #0C111B; --well: #0E1320;
    --ink: #E4E9F3; --muted: #8590A8; --edge: #2B3650; --shadow: #000;
    --cap-hi: #1E2638; --cap-lo: #141B29; --track: rgba(255,255,255,.08);
    --now: #3BE0FF; --hold: #FFD21F; --rec: #FF3B5C;
    --sky: #03050A; --sky-line: rgba(200,212,255,.22); --sky-star: rgba(220,228,255,.6);
    --m-body: #FF6B91; --m-noise: #A9B2C8; --m-metal: #7F9BFF; --m-res: #FFAA3D;
    --m-filter: #A98BFF; --m-out: #FF7D52; --m-kit: #E4E9F3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05070C; --panel: #0C111B; --well: #0E1320;
  --ink: #E4E9F3; --muted: #8590A8; --edge: #2B3650; --shadow: #000;
  --cap-hi: #1E2638; --cap-lo: #141B29; --track: rgba(255,255,255,.08);
  --now: #3BE0FF; --hold: #FFD21F; --rec: #FF3B5C;
  --sky: #03050A; --sky-line: rgba(200,212,255,.22); --sky-star: rgba(220,228,255,.6);
  --m-body: #FF6B91; --m-noise: #A9B2C8; --m-metal: #7F9BFF; --m-res: #FFAA3D;
  --m-filter: #A98BFF; --m-out: #FF7D52; --m-kit: #E4E9F3;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; color: var(--ink); background: var(--bg);
  font: 500 15px/1.45 var(--font-ui);
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 760px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- key: the shared 3D button body ---------- */
.cap {
  position: relative; border: 1.5px solid var(--edge); border-radius: 10px;
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
  color: var(--ink); cursor: pointer; font-family: var(--font-ui);
  box-shadow: 0 4px 0 var(--shadow);
  transition: transform .07s, box-shadow .07s, background-color .12s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.cap:active, .cap.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.cap:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }
/* switched on: sunk, and lit in the indicator yellow */
.cap.lit, .cap[aria-pressed="true"], .cap[aria-selected="true"] {
  background: var(--hold); color: var(--on-ink); border-color: transparent;
  transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--hold);
}

header.top { display: grid; gap: 8px; margin-bottom: 14px; }
.toprow { display: flex; align-items: center; gap: 8px; }
h1 { font: 700 clamp(20px, 5vw, 30px)/1 var(--font-head); letter-spacing: .18em; margin: 0 auto 0 0; }
h2 { font: 600 14px/1.2 var(--font-head); margin: 0; letter-spacing: .16em; text-transform: uppercase; text-wrap: balance; }
h3 { font: 600 11.5px/1 var(--font-head); margin: 0; letter-spacing: .18em; text-transform: uppercase; }

.pagenav { display: flex; gap: 6px; flex: none; }
.navbtn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; }
.subrow { display: flex; align-items: center; gap: 8px; }
.subrow .dicecap { margin-left: auto; font: 600 10.5px/1.2 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; }
#helpBtn { width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }

/* pages slide sideways as a strip (Web Animations in ui.js) */
.pages { position: relative; overflow: hidden; touch-action: pan-y; padding: 0 6px 8px; margin: 0 -6px; }
.page { display: none; }
.page.active { display: block; }
.page.leaving { position: absolute; top: 0; left: 6px; right: 6px; pointer-events: none; }

/* ---------- pad, with the ratchet bar on its right ---------- */
.padrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; max-width: 768px; margin: 0 auto; }
.padwrap {
  position: relative; max-width: 100%; aspect-ratio: 1 / 1;
  border: 1.5px solid var(--edge); border-radius: 16px; overflow: hidden; background: var(--sky);
  box-shadow: 0 5px 0 var(--shadow);
}
.padwrap canvas {
  display: block; width: 100%; height: 100%;
  touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.padwrap canvas:focus-visible { outline: 2px solid var(--hold); outline-offset: -5px; }
.ratchet {
  position: relative; border-radius: 12px; background: var(--well); border: 1.5px solid var(--edge);
  box-shadow: inset 0 2px 0 rgba(0,0,0,.12); touch-action: none; cursor: ns-resize; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.ratchet .rstop { position: absolute; left: 0; right: 0; display: grid; justify-items: center; gap: 3px; transform: translateY(50%); pointer-events: none; }
.ratchet .rstop span { font: 500 9px/1 var(--font-mono); color: var(--muted); }
.ratchet .rstop i { width: 10px; height: 1.5px; border-radius: 1px; background: var(--edge); }
.rthumb {
  position: absolute; left: 3px; right: 3px; height: 34px; border-radius: 9px; z-index: 1; transform: translateY(50%);
  display: grid; place-items: center; font: 700 11px/1 var(--font-mono); color: var(--ink);
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo)); border: 1.5px solid var(--edge); box-shadow: 0 3px 0 var(--shadow);
  transition: bottom .16s cubic-bezier(.3, 1.7, .5, 1);
}
.ratchet.held .rthumb { transition: none; background: var(--hold); color: var(--on-ink); border-color: transparent; box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--hold); }
.ratchet:focus-visible .rthumb { outline: 2px solid var(--hold); outline-offset: 2px; }

/* ---------- knob: the arc ring and the cap's shadow stay put; only the
   pointer turns ---------- */
.knobgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px 4px; margin-top: 12px; }
.knob {
  --rot: 0deg; display: grid; justify-items: center; align-content: start; gap: 3px; min-width: 0;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: ns-resize;
  -webkit-tap-highlight-color: transparent; outline: none;
}
.knob-dial { position: relative; width: var(--kd, 52px); height: var(--kd, 52px); }
.knob-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.knob-dial .trk { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.knob-dial .val { fill: none; stroke: var(--accent, var(--ink)); stroke-width: 4; stroke-linecap: round; }
.knob-cap {
  position: absolute; inset: 18%; border-radius: 50%; border: 1.5px solid var(--edge);
  background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
  box-shadow: 0 3px 0 var(--shadow);
}
.knob-ptr { position: absolute; inset: 0; transform: rotate(var(--rot)); }
.knob-ptr::after {
  content: ''; position: absolute; top: 10%; left: 50%; width: 2.5px; height: 30%;
  background: var(--ink); border-radius: 2px; transform: translateX(-50%);
}
.knob-value { font: 500 11px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
.knob-label { font: 600 10px/1.15 var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; text-align: center; max-width: 100%; }
.knob.active .knob-cap, .knob:focus-visible .knob-cap { box-shadow: 0 0 0 2px var(--hold), 0 3px 0 var(--shadow); }
.knob.active .knob-value, .knob:focus-visible .knob-value { background: var(--hold); color: var(--on-ink); }
/* a knob's modulation source: a tiny native picker under its label */
.modsel {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--edge); border-radius: 5px; background: var(--well);
  font: 600 9px/1 var(--font-mono); color: var(--muted); padding: 2px 4px; text-align: center; text-align-last: center; cursor: pointer; max-width: 46px;
}
.modsel.set { color: var(--on-ink); background: var(--hold); border-color: transparent; }

/* ---------- dice: a track with the die as a key-sized face; drag right
   for a stronger roll of whichever page is showing ---------- */
.dicefield { flex: none; }
.dicetrack {
  --dh: 34px; position: relative; width: 96px; height: var(--dh); border-radius: 9px; overflow: hidden; cursor: pointer;
  background: var(--well); border: 1.5px solid var(--edge); box-shadow: inset 0 2px 0 rgba(0,0,0,.12);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.dicetrack[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.dicetrack .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--hold); opacity: .85; }
.die {
  position: absolute; top: 0; left: 0; width: calc(var(--dh) - 3px); height: calc(var(--dh) - 3px); border-radius: 7.5px; z-index: 2;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--dh) * .2); background: #F7F9FC;
  transition: left .5s cubic-bezier(.3,.9,.3,1.1), transform .5s cubic-bezier(.3,.9,.3,1.1);
}
.die i { width: 4.5px; height: 4.5px; border-radius: 50%; background: #0E1320; place-self: center; }
.die i:nth-child(1) { grid-area: 1 / 1; } .die i:nth-child(2) { grid-area: 1 / 3; } .die i:nth-child(3) { grid-area: 2 / 2; }
.die i:nth-child(4) { grid-area: 3 / 1; } .die i:nth-child(5) { grid-area: 3 / 3; }
.dicetrack.dragging .die { transition: none; }
.dicetrack:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }

/* ---------- transport row + steps ---------- */
.seq { margin-top: 20px; }
.transport { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.transport .knobslot { flex: 1 1 0; min-width: 0; }
.transport .knob { --kd: 48px; }
.btn { font: 700 12px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; padding: 0 14px; min-height: 42px; }
.btn.icon { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; padding: 0 10px; }
#play, #record, #smooth { width: 54px; height: 54px; border-radius: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
#record { color: var(--rec); }
/* record keeps its own red when armed rather than the indicator yellow */
#record[aria-pressed="true"] { background: var(--rec); color: #fff; box-shadow: 0 1px 0 var(--shadow), 0 0 14px -2px var(--rec); }
#record[aria-pressed="true"] svg { animation: recBlink 1s step-start infinite; }
@keyframes recBlink { 50% { opacity: .25; } }
#play .ic-stop { display: none; }
#play[aria-pressed="true"] .ic-play { display: none; }
#play[aria-pressed="true"] .ic-stop { display: inline-block; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.grp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { display: grid; gap: 6px; }
.led { display: block; height: 4px; border-radius: 2px; background: var(--track); }
.cell.now .led { background: var(--now); box-shadow: 0 0 10px var(--now); }
.step {
  position: relative; width: 100%; aspect-ratio: 5 / 6; padding: 0; border-radius: 10px; overflow: hidden;
  border: 1.5px solid var(--edge); background: var(--well); color: var(--ink); cursor: pointer;
  box-shadow: 0 4px 0 var(--shadow);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; transition: transform .07s, box-shadow .07s;
}
.step .n { position: absolute; top: 6px; left: 8px; font: 600 12px/1 var(--font-head); letter-spacing: .04em; opacity: .5; }
.step .dot {
  display: none; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(5,7,12,.55);
  left: calc(14% + var(--dx, .5) * 72%); bottom: calc(12% + var(--dy, .5) * 56%); transform: translate(-50%, 50%);
}
.step.on { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%), var(--c, #555); color: var(--tc, #fff); border-color: rgba(0,0,0,.35); }
.step.on .n { opacity: .9; }
.step.on .dot { display: block; }
.step .hits { position: absolute; top: 4px; right: 6px; font: 700 10px/1 var(--font-mono); letter-spacing: -1px; opacity: .85; }
.cell.now .step { transform: translateY(-2px); box-shadow: 0 6px 0 var(--shadow), 0 0 0 2px var(--now); }
.step.held { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow), 0 0 0 3px var(--hold); }
.step:focus-visible { outline: 2px solid var(--hold); outline-offset: 3px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.tools .gap { flex: 1 1 8px; }

/* ---------- modulation page ---------- */
.modsky { aspect-ratio: 16 / 11; }
.mods { display: grid; gap: 6px; margin-top: 14px; }
.mod {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center;
  padding: 5px 6px 5px 5px; border-radius: 11px; border: 1.5px solid var(--edge); background: var(--well); cursor: pointer;
}
.mod.sel { border-color: var(--hold); box-shadow: 0 0 0 1px var(--hold); }
.mod canvas { width: 40px; height: 40px; display: block; border-radius: 8px; background: var(--sky); }
.mod .nm { font: 600 11px/1.15 var(--font-head); letter-spacing: .16em; display: flex; align-items: center; gap: 6px; }
.mod .nm i { width: 8px; height: 8px; border-radius: 50%; background: var(--mc); }
.mod .sm { font: 500 10.5px/1.3 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.assign { font: 700 9.5px/1.05 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; width: 48px; height: 38px; padding: 0 2px; border-radius: 9px; touch-action: none; }
.minidie { width: 34px; height: 34px; padding: 0; border-radius: 8px; border: 0; background: #F7F9FC; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; cursor: pointer; box-shadow: 0 3px 0 var(--shadow); transition: transform .07s, box-shadow .07s; }
.minidie:active { transform: translateY(2px) rotate(20deg); box-shadow: 0 1px 0 var(--shadow); }
.minidie i { width: 4px; height: 4px; border-radius: 50%; background: #0E1320; place-self: center; }
.minidie i:nth-child(1) { grid-area: 1 / 1; } .minidie i:nth-child(2) { grid-area: 1 / 3; } .minidie i:nth-child(3) { grid-area: 2 / 2; }
.minidie i:nth-child(4) { grid-area: 3 / 1; } .minidie i:nth-child(5) { grid-area: 3 / 3; }
.minidie:focus-visible { outline: 2px solid var(--hold); outline-offset: 2px; }
.modedit { margin-top: 16px; display: grid; gap: 12px; }
.pickrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.pick { display: grid; gap: 5px; min-width: 0; }
.pick > span { font: 600 9.5px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pickbtn, .picksel {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 0 30px 0 10px; text-align: left;
  font: 600 13px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
}
.pickwrap { position: relative; display: flex; }
.pickwrap::after { content: '\25BE'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 13px; color: var(--ink); }
.pickbtn svg { flex: none; }
.shapemenu {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: min(300px, 86vw); max-height: 320px; overflow-y: auto;
  background: var(--panel); border: 1.5px solid var(--edge); border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.5);
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.shapemenu[hidden] { display: none; }
.shapemenu button {
  display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; border: 0; background: transparent; color: var(--ink);
  font: 600 11.5px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-align: left;
}
.shapemenu button:hover, .shapemenu button:focus-visible { background: var(--well); outline: none; }
.shapemenu button[aria-checked="true"] { background: var(--hold); color: var(--on-ink); }
.shapemenu .grouplabel { grid-column: 1 / -1; font: 600 9.5px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 2px; }
.modedit .knobgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 0; }

/* ---------- lanes ---------- */
.lanehead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 12px; }
.lanehead h2 { margin-right: auto; }
.lanetabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 700 11.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .1em; padding: 0 12px; min-height: 36px; border-radius: 9px; }
.btn.small { min-height: 36px; font-size: 11.5px; border-radius: 9px; }
#laneCanvas {
  display: block; width: 100%; height: min(58vh, 460px); margin-top: 14px; border-radius: 10px;
  touch-action: none; cursor: crosshair; background: var(--sky); border: 1.5px solid var(--edge);
}
.lanereadout { margin: 8px 0 0; min-height: 1.3em; font: 500 12px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- engine ---------- */
.enginepick { display: flex; gap: 8px; margin: 12px 0 2px; }
.enginepick select {
  flex: 1 1 auto; min-width: 0; font: 600 15px/1 var(--font-head); text-transform: uppercase; letter-spacing: .14em;
  padding: 0 12px; min-height: 44px; appearance: none; -webkit-appearance: none;
}
.selwrap { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
.selwrap select { width: 100%; }
.selwrap::after { content: '\25BE'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 14px; color: var(--ink); }
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px 22px; margin-top: 16px; }
.module { padding-top: 10px; border-top: 1px solid var(--edge); }
.module h3 { display: flex; align-items: center; gap: 8px; }
.module h3::before { content: ''; width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.module .knobgrid { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px 2px; margin-top: 8px; }
.module .knob { --kd: 42px; }
.module .knob-label { font-size: 9px; }
.module .knob-value { font-size: 10px; }

/* ---------- help sheet: what's on the page you're looking at ---------- */
.help {
  position: fixed; z-index: 50; inset: auto 0 0 0; max-height: 72vh; overflow-y: auto;
  background: var(--panel); border-top: 1.5px solid var(--edge); border-radius: 18px 18px 0 0; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.5);
  padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.help .inner { max-width: 720px; margin: 0 auto; display: grid; gap: 10px; }
.help .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.how b { color: var(--ink); font-weight: 700; }
kbd { font: 500 12px var(--font-mono); padding: 1px 5px; border: 1.5px solid var(--edge); border-radius: 5px; background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--shadow); }

@media (max-width: 640px) {
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .navbtn { width: 38px; height: 38px; }
  .pagenav { gap: 4px; }
  .padrow { grid-template-columns: minmax(0, 1fr) 36px; gap: 6px; }
  .transport { gap: 6px; }
  .transport .knob { --kd: 42px; }
  #play, #record, #smooth { width: 48px; height: 48px; }
  .mod { grid-template-columns: 40px minmax(0, 1fr) auto auto auto; gap: 6px; }
  .assign { width: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .step, .cap, .die, .minidie, .rthumb { transition: none; }
  #record[aria-pressed="true"] svg { animation: none; }
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="toprow">
      <h1>PIXY</h1>
      <nav class="pagenav" aria-label="Pages">
        <button class="navbtn cap" type="button" data-page="pad" aria-pressed="true" aria-label="Star chart: pad and sequencer" title="Star chart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 17l5-9 5 6 4-8" opacity=".5"/><circle cx="5" cy="17" r="2" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="2.2" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="navbtn cap" type="button" data-page="mod" aria-pressed="false" aria-label="Modulation" title="Modulation">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8.5" opacity=".55"/><circle cx="18" cy="6" r="2.3" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="navbtn cap" type="button" data-page="lanes" aria-pressed="false" aria-label="Step lanes" title="Step lanes">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="10" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="10.4" y="4" width="3.2" height="17" rx="1" fill="currentColor"/><rect x="17.8" y="13" width="3.2" height="8" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="navbtn cap" type="button" data-page="kit" aria-pressed="false" aria-label="Whole kit" title="Whole kit">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="5.2"/><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/><path d="M6.2 7.4v2.2a2.6 1.2 0 0 0 5.2 0V7.4"/><ellipse cx="8.8" cy="7.4" rx="2.6" ry="1.2"/><path d="M12.6 7.4v2.2a2.6 1.2 0 0 0 5.2 0V7.4"/><ellipse cx="15.2" cy="7.4" rx="2.6" ry="1.2"/><path d="M1.2 4.6l4.4-1.4M3.4 4v17M22.8 4.6l-4.4-1.4M20.6 4v17"/></svg>
        </button>
        <button class="navbtn cap" type="button" data-page="engine" aria-pressed="false" aria-label="Drum engine" title="Drum engine">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><ellipse cx="12" cy="7" rx="8" ry="3.4"/><path d="M4 7v9.5C4 18.5 7.6 20 12 20s8-1.5 8-3.5V7"/><path d="M4.9 4.4L2 2.3M19.1 4.4L22 2.3"/></svg>
        </button>
      </nav>
    </div>
    <div class="subrow">
      <button id="helpBtn" class="cap" type="button" aria-label="Help for this page" aria-expanded="false" aria-controls="help" title="Help for this page">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6" stroke-linecap="round"/><circle cx="12" cy="7.3" r="1.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <span class="dicecap" id="diceCap" aria-hidden="true">Randomize sequence</span>
      <div class="dicefield" id="diceField"></div>
    </div>
  </header>

  <div class="pages" id="pages">
    <section class="page active" data-page="pad">
      <div class="padrow">
        <div class="padwrap">
          <canvas id="pad" tabindex="0" role="application" aria-label="Star chart pad. Touch or drag to choose a drum sound; the closest sound plays. Arrow keys move the cursor and Enter plays it."></canvas>
        </div>
        <div class="ratchet" id="ratchet" tabindex="0" role="slider" aria-label="Ratchet" aria-valuemin="16" aria-valuemax="96" aria-valuenow="16" aria-valuetext="1/16" title="Ratchet: hold higher while recording to cut each step into more hits. Springs back to 1/16 when you let go.">
          <div class="rthumb" id="rthumb">16</div>
        </div>
      </div>

      <section class="seq" aria-label="Sequencer">
        <div class="transport">
          <button id="play" class="cap icon" type="button" aria-pressed="false" aria-label="Play" title="Play">
            <svg class="ic-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
            <svg class="ic-stop" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
          </button>
          <button id="record" class="cap icon" type="button" aria-pressed="false" aria-label="Record" title="While playing, touching the pad writes into whichever step is passing">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>
          </button>
          <button id="smooth" class="cap icon" type="button"></button>
          <div class="knobslot" id="tempoField"></div>
          <div class="knobslot" id="swingField"></div>
        </div>

        <div id="steps" class="steps"></div>

        <div class="tools">
          <button id="undo" class="btn cap icon" type="button" aria-label="Undo" title="Undo (Ctrl/Cmd+Z)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 7L3 12l5 5M3 12h11a6 6 0 0 1 0 12h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="redo" class="btn cap icon" type="button" aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="transform:scaleX(-1)"><path d="M8 7L3 12l5 5M3 12h11a6 6 0 0 1 0 12h-2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="gap"></span>
          <button id="mono" class="btn cap icon" type="button" aria-pressed="false" aria-label="Choke" title="Choke: a new hit cuts off whatever is still ringing">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c1.2-6 2.4-6 3.6 0s2.4 6 3.6 0 2.2-4.4 3.3 0"/><path d="M15.5 4.5v15" stroke-width="2.4"/><path d="M18.5 12h3.5" opacity=".45"/></svg>
          </button>
          <button id="select" class="btn cap icon" type="button" aria-pressed="false" aria-label="Select" title="Select: steps you tap stay held, so the pad updates them">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3.2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
          <button id="clear" class="btn cap icon" type="button" aria-label="Clear" title="Clear all steps">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>
          </button>
        </div>
      </section>
    </section>

    <section class="page" data-page="mod" aria-label="Modulation">
      <div class="padwrap modsky">
        <canvas id="modSky" tabindex="0" role="application" aria-label="Star chart for assigning modulation. Hold Step or Drum on a modulator and tap stars, or hold a star and tap Step or Drum."></canvas>
      </div>
      <div class="mods" id="mods"></div>
      <div class="modedit" id="modEdit">
        <div class="pickrow">
          <div class="pick"><span id="shapeLbl">Shape</span>
            <div class="pickwrap">
              <button id="shapeBtn" class="pickbtn cap" type="button" aria-haspopup="menu" aria-expanded="false" aria-labelledby="shapeLbl shapeBtn"></button>
              <div class="shapemenu" id="shapeMenu" role="menu" hidden></div>
            </div>
          </div>
          <div class="pick"><span id="destLbl">Destination</span>
            <div class="pickwrap"><select id="destSel" class="picksel cap" aria-labelledby="destLbl"></select></div>
          </div>
        </div>
        <div class="knobgrid" id="modKnobs" style="--accent: var(--mc)"></div>
      </div>
    </section>

    <section class="page" data-page="lanes">
      <div class="lanehead">
        <h2 id="lanesH">Step lanes</h2>
        <button id="laneReset" class="btn cap small" type="button">Reset lane</button>
      </div>
      <div class="lanetabs" role="tablist" aria-label="Lane to edit">
        <button class="tab cap" type="button" data-lane="prob" role="tab" aria-selected="true">Chance</button>
        <button class="tab cap" type="button" data-lane="devx" role="tab" aria-selected="false">X drift</button>
        <button class="tab cap" type="button" data-lane="devy" role="tab" aria-selected="false">Y drift</button>
        <button class="tab cap" type="button" data-lane="decay" role="tab" aria-selected="false">Decay</button>
      </div>
      <canvas id="laneCanvas" role="img" aria-label="Per-step lane values. Drag a bar up or down to set it, or drag sideways to set several steps at once."></canvas>
      <p class="lanereadout" id="laneReadout">&nbsp;</p>
    </section>

    <section class="page" data-page="kit" aria-labelledby="tweakH" style="--accent: var(--m-kit)">
      <h2 id="tweakH">Whole kit</h2>
      <div class="knobgrid" id="kitKnobs"></div>
    </section>

    <section class="page" data-page="engine" aria-labelledby="engineH">
      <h2 id="engineH">Drum engine</h2>
      <div class="enginepick">
        <div class="selwrap"><select id="engineSelect" class="cap" aria-label="Drum to edit"></select></div>
        <button id="engineReset" class="btn cap small" type="button">Reset</button>
      </div>
      <div id="engineParams" class="modules"></div>
    </section>
  </div>
</main>

<div class="help" id="help" role="dialog" aria-modal="false" aria-labelledby="helpH" hidden>
  <div class="inner">
    <div class="head"><h2 id="helpH">Star chart</h2><button id="helpClose" class="btn cap small" type="button">Close</button></div>
    <ul class="how" id="helpList"></ul>
  </div>
</div>

<script>
/*CORE*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
